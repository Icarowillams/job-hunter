strict_config: true

source: serpapi

serpapi:
  api_key: ${SERPAPI_API_KEY}
  searches:
    - query: "desenvolvedor frontend junior"
      location: Brazil
      gl: br
      hl: pt
      limit: 10

    - query: "desenvolvedor backend junior"
      location: Brazil
      gl: br
      hl: pt
      limit: 10

    - query: "desenvolvedor full stack junior"
      location: Brazil
      gl: br
      hl: pt
      limit: 10

    - query: "software developer junior"
      location: United States
      gl: us
      hl: en
      limit: 10

    - query: "software developer junior"
      location: Portugal
      gl: pt
      hl: pt
      limit: 10

    - query: "desenvolvedor de software"
      location: "Recife, State of Pernambuco, Brazil"
      gl: br
      hl: pt
      limit: 10

notification:
  enabled: true
  minimum_score: 70
  channel: email

email:
  smtp_server: ${EMAIL_SMTP_SERVER}
  smtp_port: 587
  username: ${EMAIL_USERNAME}
  password: ${EMAIL_PASSWORD}
  from: ${EMAIL_FROM}
  to: ${EMAIL_TO}

paths:
  profile: data/profile.json
  db: data/job_hunter.db

metrics:
  enabled: true
  persist: true
