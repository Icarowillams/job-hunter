[tool.poetry]
name = "job-hunter"
version = "0.1.0"
description = "Job Hunter Inteligente"
authors = ["Icaro"]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0"
pydantic-settings = "^2.0"
requests = "^2.31"
httpx = "^0.25"
pyyaml = "^6.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-mock = "^3.11"
black = "^23.0"
isort = "^5.12"
flake8 = "^6.0"
mypy = "^1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
